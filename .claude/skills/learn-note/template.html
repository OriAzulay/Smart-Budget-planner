<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>{{CATEGORY}} › {{TOPIC}}</title>
<style>
  @page { size: A4; margin: 18mm 16mm; }
  body {
    font-family: "Segoe UI", "Arial", sans-serif;
    font-size: 11.5pt; line-height: 1.6; color: #1f2933; background: #fff;
    margin: 0;
  }
  header.doc { border-bottom: 3px solid #2563eb; padding-bottom: 8px; margin-bottom: 14px; }
  header.doc .crumb { color: #2563eb; font-weight: 600; font-size: 10pt; letter-spacing: .5px; }
  header.doc h1 { margin: 2px 0 0; font-size: 22pt; }
  .intro { background: #eff6ff; border-right: 4px solid #2563eb; padding: 10px 14px; border-radius: 4px; margin-bottom: 14px; }
  nav.toc { font-size: 10pt; margin-bottom: 18px; }
  nav.toc h3 { margin: 0 0 4px; font-size: 11pt; }
  nav.toc ol { margin: 0; padding-right: 20px; }
  nav.toc a { color: #1f2933; text-decoration: none; }
  nav.toc .d { color: #6b7280; }
  article { border-top: 1px solid #d1d5db; padding-top: 12px; margin-top: 18px; }
  article h2 { margin: 0; font-size: 15pt; color: #111827; }
  .meta { color: #6b7280; font-size: 9.5pt; margin: 2px 0 10px; }
  h4 { margin: 12px 0 4px; font-size: 11.5pt; color: #1d4ed8; }
  p { margin: 4px 0; }
  ul, ol { margin: 4px 0; padding-right: 22px; }
  li { margin: 2px 0; }
  code { direction: ltr; unicode-bidi: isolate; font-family: Consolas, "Courier New", monospace;
         font-size: 9.5pt; background: #f3f4f6; padding: 1px 4px; border-radius: 3px; }
  pre { direction: ltr; text-align: left; background: #0f172a; color: #e2e8f0; padding: 10px 12px;
        border-radius: 6px; font-size: 9.5pt; line-height: 1.45; white-space: pre-wrap; break-inside: avoid; }
  pre code { background: none; color: inherit; padding: 0; }
  .glossary { background: #fefce8; border: 1px solid #fde68a; border-radius: 6px; padding: 6px 12px; margin-top: 10px; break-inside: avoid; }
  .glossary h4 { color: #92400e; margin-top: 4px; }
</style>
</head>
<body>
<header class="doc">
  <div class="crumb">{{CATEGORY}}</div>
  <h1>{{TOPIC_TITLE}}</h1>
</header>

<div class="intro">
{{INTRO}}
</div>

<nav class="toc">
<!--TOC-->
<!--/TOC-->
</nav>

<!--ENTRIES-->
</body>
</html>
